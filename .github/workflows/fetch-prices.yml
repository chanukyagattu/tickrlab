# .github/workflows/fetch-prices.yml
#
# The API key lives in repository secrets and never reaches the browser.
# Visitors read a static JSON file, so 10,000 concurrent users cost exactly
# the same number of upstream API calls as one: zero.
#
# Output is force-pushed as a SINGLE commit to an orphan `data` branch.
# A 30-minute cron that commits normally produces ~17,000 commits a year
# and a repo nobody can clone. Rebuilding the branch from scratch each run
# keeps it permanently at one commit.

name: Fetch prices

on:
  schedule:
    # 21:40 UTC on weekdays — after the US close (20:00/21:00 UTC depending
    # on daylight saving), with margin for the provider settling EOD bars.
    - cron: '40 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch          # shared with fetch-news to serialise pushes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch OHLCV for the universe
        env:
          PROVIDER_KEY: ${{ secrets.PROVIDER_KEY }}
        run: node scripts/fetch-prices.mjs --out dist-data

      # A provider returning 200 with an empty body is the common failure
      # here, and it is worse than an error: it would publish an empty
      # dashboard over good data. Refuse to publish anything we cannot
      # sanity check.
      - name: Validate output before publishing
        run: |
          set -euo pipefail
          test -s dist-data/prices.json

          node -e '
            const d = require("./dist-data/prices.json");
            const n = Object.keys(d.assets ?? {}).length;
            if (n < 40) { console.error(`only ${n} assets; refusing`); process.exit(1); }
            for (const [sym, a] of Object.entries(d.assets)) {
              if (!Array.isArray(a.candles) || a.candles.length < 60) {
                console.error(`${sym}: ${a.candles?.length ?? 0} candles, need 60+`);
                process.exit(1);
              }
            }
            console.log(`ok: ${n} assets`);
          '

      - name: Publish to data branch
        run: |
          set -euo pipefail
          cd dist-data

          # Fresh repo => exactly one commit, every time.
          git init -q
          git checkout -qb data
          git config user.name  'tickrlab-bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -qm "data: prices $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            data
