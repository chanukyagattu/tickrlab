# .github/workflows/deploy.yml
#
# Builds the Vite app and publishes dist/ to GitHub Pages. Tests and typecheck
# gate the deploy — a dashboard that renders a wrong number confidently is
# worse than one that fails to ship.
#
# Vite copies public/ into dist/ verbatim, so the wireframes stay served at
# /tickrlab/wireframes/ — the same URL they had before the app existed. That is
# why they live in public/ rather than docs/.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; do not run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Gate the deploy on the suite. A dashboard that renders a wrong number
      # confidently is worse than one that fails to deploy, and the indicator
      # tests are the only thing standing between those two outcomes.
      - run: npm test

      - run: npm run typecheck

      # vite build -> dist/, copying public/ in verbatim. That is why the
      # wireframes live in public/: they land at /tickrlab/wireframes/ with no
      # extra config and the URL never moved when the app was added.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
